[project]
name = "qslcards"
version = "0.1.0"
description = "QSL-Karten-Generator: erzeugt aus einem Logbuch (ADIF/Cabrillo) QSL-Karten als PDF."
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]